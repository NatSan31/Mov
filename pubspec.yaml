name: fitpulse_app
description: "FitPulse: Fitness Club & Pro Shop - Aplicación Móvil Integral con Firebase, Sensores, Geolocalización y Pasarela de Pagos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Manejo de Estado (Estricto: Sin setState ni ValueNotifier)
  provider: ^6.1.2

  # Firebase Core & Servicios
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Autenticación Social
  google_sign_in: ^6.2.1

  # Sensores Nativos y Hardware
  sensors_plus: ^6.1.0
  local_auth: ^2.3.0

  # Geolocalización & Mapas Nativos
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Tipografía y Temas
  google_fonts: ^6.2.1

  # UI / UX y Widgets Avanzados
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

  # Iconos
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
